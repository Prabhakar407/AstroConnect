name: Quality certification

on:
  pull_request:
  push:
    branches:
      - main
      - design/page-by-page

permissions:
  contents: read

concurrency:
  group: astro-advice-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the supported Node release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Use the supported Python release
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            src/backend/requirements-dev.txt
            src/backend/requirements-tested.lock
      - name: Install locked application and test tools
        run: |
          npm ci
          python -m pip install --constraint src/backend/requirements-tested.lock --requirement src/backend/requirements-dev.txt
      - name: Install isolated database and browser engines
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          npx playwright install --with-deps chromium firefox webkit
      - name: Run the complete side-effect-free certification
        env:
          ASTRO_TEST_PYTHON: python
          ASTRO_BROWSER_CERTIFICATION_ROOT: ${{ github.workspace }}/verification-results/browser
        run: npm run verify:release
      - name: Retain sanitized evidence briefly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-certification-${{ github.sha }}
          path: verification-results/
          if-no-files-found: warn
          retention-days: 3
