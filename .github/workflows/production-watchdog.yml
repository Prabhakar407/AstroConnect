name: Production watchdog

on:
  schedule:
    # Cloudflare is scheduled at 0, 15, 30 and 45 minutes past the hour. Check
    # eight minutes later so a normal recovery has time to finish without hiding a miss.
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-advice-production-watchdog
  cancel-in-progress: true

jobs:
  check-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check out the permanent monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the supported Node release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check the official website and recovery heartbeat
        env:
          ASTRO_PRODUCTION_ORIGIN: https://astroadvicebykundansingh.com
        run: node tests/production-watchdog.mjs
